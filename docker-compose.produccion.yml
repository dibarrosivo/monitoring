# Producción. Se levanta con:
#   docker compose -f docker-compose.produccion.yml up -d
#
# Las variables vienen de /opt/monitoring/.env, que genera desplegar.sh.

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: monitoring
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: monitoring
    volumes:
      - datos-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U monitoring']
      interval: 10s
      timeout: 5s
      retries: 10
    # Sin puertos publicados: la base solo se alcanza desde la red interna

  # Aplica las migraciones antes de que arranquen la API y el receptor.
  # Corre una vez y termina; los demás servicios esperan a que salga bien.
  migraciones:
    build:
      context: .
      target: app
    image: monitoring-app
    command: npm run db:migrar
    env_file: .env
    environment:
      DATABASE_URL: postgres://monitoring:${POSTGRES_PASSWORD}@postgres:5432/monitoring
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    build:
      context: .
      target: app
    image: monitoring-app
    command: npm run api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://monitoring:${POSTGRES_PASSWORD}@postgres:5432/monitoring
    depends_on:
      migraciones:
        condition: service_completed_successfully
    # Solo la alcanza Caddy por la red interna

  receptor:
    build:
      context: .
      target: app
    image: monitoring-app
    command: npm run receiver
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://monitoring:${POSTGRES_PASSWORD}@postgres:5432/monitoring
    # Expuesto directo: los paneles hablan TCP y UDP crudo, no HTTP
    ports:
      - '9999:9999/tcp'
      - '9999:9999/udp'
      # Escucha del receptor PIMA: el programa de la central entrega por TCP crudo
      - '10050:10050/tcp'
      # Escucha Sur-Gard MLR2 con ACK: el receptor EBS OSM entrega acá
      - '10060:10060/tcp'
    depends_on:
      migraciones:
        condition: service_completed_successfully

  web:
    build:
      context: .
      target: web
    image: monitoring-web
    restart: unless-stopped
    environment:
      DOMINIO_CONSOLA: ${DOMINIO_CONSOLA}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - datos-caddy:/data
      - config-caddy:/config
      - registros-caddy:/var/log/caddy
      # APK y página de descarga de la app Android (no van en git)
      - ./app:/srv/app:ro
    depends_on:
      - api

  # Receptor EBS propio: OSM.Server, el programa de Windows de EBS, bajo Wine.
  # Los transmisores EBS (LX) solo saben hablar con este programa, así que para
  # dejar de depender del servidor de la central hay que correrlo acá. Los
  # binarios son propietarios y no van en git: viven en ./osm en el servidor.
  # Se activa con COMPOSE_PROFILES=ebs en .env. Ver packages/receiver/EBS-OSM.md.
  osm:
    image: scottyhardy/docker-wine:stable
    profiles: ['ebs']
    restart: unless-stopped
    user: root
    entrypoint: ['bash', '/osm/arrancar.sh']
    volumes:
      - ./osm:/osm
    ports:
      # Transmisores LX: entran desde la red móvil, así que público
      - '5200:5200/tcp'
      # Consola de administración (OSM Tools): solo local, se usa por túnel SSH
      - '127.0.0.1:9000:9000/tcp'
    depends_on:
      - receptor

volumes:
  datos-postgres:
  datos-caddy:
  config-caddy:
  registros-caddy:
