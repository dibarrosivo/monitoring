# Compuerta de calidad: nada llega a producción sin pasar por acá.
# El job de despliegue (git archive → VPS + desplegar.sh) se agrega al configurar el servidor.
name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
