# Compuerta de calidad: nada llega a producción sin pasar por acá.
# El job de despliegue (git archive → VPS + desplegar.sh) se agrega al configurar el servidor.
name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: monitoring
          POSTGRES_PASSWORD: monitoring
          POSTGRES_DB: monitoring
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U monitoring"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Las pruebas de integración crean y migran su propia base _test
      DATABASE_URL_PRUEBAS: postgres://monitoring:monitoring@localhost:5432/monitoring_test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Pruebas unitarias (protocolos, motor, clasificación)
        run: npm test
      - name: Pruebas de integración de la API (contra PostgreSQL)
        run: npm run test:integracion
      - name: Build de la consola
        run: npm run build -w @monitoring/console
