# Compuerta de calidad y despliegue.
#
# Cualquier rama pasa por las pruebas. Solo un push a `main` despliega, y solo
# si las pruebas pasaron: el job de despliegue depende del de pruebas, así que
# una prueba en rojo detiene la publicación antes de tocar el servidor.
name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: monitoring
          POSTGRES_PASSWORD: monitoring
          POSTGRES_DB: monitoring
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U monitoring"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Las pruebas de integración crean y migran su propia base _test
      DATABASE_URL_PRUEBAS: postgres://monitoring:monitoring@localhost:5432/monitoring_test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Pruebas unitarias (protocolos, motor, clasificación)
        run: npm test
      - name: Pruebas de integración de la API (contra PostgreSQL)
        run: npm run test:integracion
      - name: Build de la consola
        run: npm run build -w @monitoring/console

  desplegar:
    # Solo desde main, y solo si las pruebas pasaron
    needs: pruebas
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # Un despliegue a la vez: dos simultáneos podrían dejar el servidor a medias
    concurrency:
      group: despliegue-produccion
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - name: Preparar la clave de acceso al servidor
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/despliegue
          chmod 600 ~/.ssh/despliegue
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Subir el código
        run: |
          git archive HEAD | ssh -i ~/.ssh/despliegue -o BatchMode=yes \
            root@${{ secrets.VPS_HOST }} \
            "mkdir -p /opt/monitoring && tar -x -C /opt/monitoring"

      - name: Desplegar
        run: |
          ssh -i ~/.ssh/despliegue -o BatchMode=yes \
            root@${{ secrets.VPS_HOST }} \
            "cd /opt/monitoring && chmod +x desplegar.sh && DOMINIO_CONSOLA='${{ secrets.DOMINIO_CONSOLA }}' ./desplegar.sh"
