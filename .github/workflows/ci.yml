# Compuerta de calidad y despliegue.
#
# Cualquier rama pasa por las pruebas. Solo un push a `main` despliega, y solo
# si las pruebas pasaron: el job de despliegue depende del de pruebas, así que
# una prueba en rojo detiene la publicación antes de tocar el servidor.
name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: monitoring
          POSTGRES_PASSWORD: monitoring
          POSTGRES_DB: monitoring
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U monitoring"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Las pruebas de integración crean y migran su propia base _test
      DATABASE_URL_PRUEBAS: postgres://monitoring:monitoring@localhost:5432/monitoring_test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Pruebas unitarias (protocolos, motor, clasificación)
        run: npm test
      - name: Pruebas de integración de la API (contra PostgreSQL)
        run: npm run test:integracion
      - name: Build de la consola
        run: npm run build -w @monitoring/console

  desplegar:
    # Solo desde main, y solo si las pruebas pasaron
    needs: pruebas
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # Un despliegue a la vez: dos simultáneos podrían dejar el servidor a medias
    concurrency:
      group: despliegue-produccion
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
        with:
          # Historia completa: la entrega compara contra el SHA que quedó
          # desplegado para saber qué archivos borrar en el servidor. Con un
          # solo commit no hay con qué comparar.
          fetch-depth: 0

      - name: Preparar la clave de acceso al servidor
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/despliegue
          chmod 600 ~/.ssh/despliegue
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Subir el código
        run: |
          SSH="ssh -i ~/.ssh/despliegue -o BatchMode=yes root@${{ secrets.VPS_HOST }}"

          # 1. Qué quedó desplegado la vez anterior. Se lee ANTES de extraer.
          ANTERIOR="$($SSH 'cat /opt/monitoring/.sha-desplegado 2>/dev/null || true' | tr -d '[:space:]')"

          # 2. Entregar solo lo versionado: git archive no trae .env, secretos,
          #    app/, osm/ ni respaldos/, que viven solo en el servidor.
          git archive HEAD | $SSH "mkdir -p /opt/monitoring && tar -x -C /opt/monitoring"

          # 3. Borrar lo que git dice que desapareció desde el despliegue
          #    anterior. tar sobreescribe pero NUNCA borra: un archivo
          #    eliminado en git sobrevive en el servidor y se sigue copiando a
          #    la imagen. En TrueTracker eso dejó un .tsx huérfano que rompió
          #    el build y frenó un despliegue 44 minutos (fleetview af7749c), y
          #    acá el 03-10-2026 había 12 huérfanos, entre ellos las copias
          #    viejas de la lógica de avisos que se mudó a @monitoring/shared.
          #    Las pruebas no lo pueden atrapar: CI trabaja sobre un árbol
          #    limpio, y el sucio existe solo en el servidor.
          #    Quirúrgico a propósito: solo rutas que estuvieron en git y ya
          #    no están; nunca .env, secretos, app/, osm/ ni respaldos/.
          if [ -n "$ANTERIOR" ] && git cat-file -e "$ANTERIOR^{commit}" 2>/dev/null; then
            BORRADOS="$(git diff --name-only --diff-filter=D "$ANTERIOR" HEAD)"
            if [ -n "$BORRADOS" ]; then
              echo "Eliminados desde $ANTERIOR, se borran en el servidor:"
              printf '%s\n' "$BORRADOS" | sed 's/^/  - /'
              printf '%s\n' "$BORRADOS" \
                | $SSH 'cd /opt/monitoring && while IFS= read -r f; do [ -n "$f" ] && rm -f -- "$f"; done'
            else
              echo "Sin archivos eliminados desde $ANTERIOR."
            fi
          else
            echo "Sin SHA anterior utilizable: esta corrida no borra nada."
          fi

      - name: Desplegar
        run: |
          ssh -i ~/.ssh/despliegue -o BatchMode=yes \
            root@${{ secrets.VPS_HOST }} \
            "cd /opt/monitoring && chmod +x desplegar.sh && DOMINIO_CONSOLA='${{ secrets.DOMINIO_CONSOLA }}' ./desplegar.sh"

      - name: Marcar lo desplegado
        # Recién con el despliegue arriba: si desplegar.sh falla, este paso no
        # corre, el marcador viejo queda intacto y el próximo intento
        # recalcula el delta completo en vez de dar por desplegado lo que no.
        run: |
          ssh -i ~/.ssh/despliegue -o BatchMode=yes root@${{ secrets.VPS_HOST }} \
            "printf '%s\n' '$(git rev-parse HEAD)' > /opt/monitoring/.sha-desplegado"
